name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: 'stable'
          cache: false

      - name: Create key.properties
        run: |
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" > ./android/key.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> ./android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./android/key.properties

      - name: Load key
        run: echo "${{ secrets.KEYSTORE_JKS_RELEASE }}" | base64 --decode > android/app/release-key.jks

      - name: Turn off analytics
        run: flutter config --no-analytics

      - name: Pub Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --flavor prod

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-prod-release.apk; do
            abi=${f#app-}; abi=${abi%-prod-release.apk}
            mv "$f" "wake-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -l

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/wake-*.apk"
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
